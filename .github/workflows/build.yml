name: Build binaries

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/linux/**"
      - "crates/**"
      - "android/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/linux/**"
      - "crates/**"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suika-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: RustSec dependency advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # setup-rust-toolchain v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Install pinned cargo-audit
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit both committed Rust lockfiles
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          status=0
          cargo audit --file "$GITHUB_WORKSPACE/Cargo.lock" || status=1
          cargo audit --file "$GITHUB_WORKSPACE/android/native/Cargo.lock" || status=1
          exit "$status"

  linux:
    name: Rust core and Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Enforce no application logging
        run: bash scripts/check-no-application-logs.sh

      - name: Detect Rust workspace and Linux application
        id: detect
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "core_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "core_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f apps/linux/Cargo.toml ]]; then
            echo "linux_app_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "linux_app_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Linux executable build skipped: apps/linux/Cargo.toml has not been added yet."
          fi

      - name: Install GTK4 build dependencies
        if: steps.detect.outputs.linux_app_ready == 'true'
        timeout-minutes: 30
        run: |
          # Avoid the region-specific EC2 mirror that has been timing out on the
          # hosted runner; use the canonical Ubuntu archive over HTTPS instead.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          timeout 240s sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            -o Acquire::ForceIPv4=true \
            update
          timeout 1200s sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            -o Acquire::ForceIPv4=true \
            install --no-install-recommends --yes libgtk-4-dev pkg-config

      - name: Set up Rust
        if: steps.detect.outputs.core_ready == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # setup-rust-toolchain v2.0.1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Check formatting
        if: steps.detect.outputs.core_ready == 'true'
        run: cargo fmt --all -- --check

      - name: Run Rust workspace tests
        if: steps.detect.outputs.core_ready == 'true'
        run: cargo test --locked --workspace --all-targets

      - name: Run Clippy
        if: steps.detect.outputs.core_ready == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Audit dependency feature tree
        if: steps.detect.outputs.core_ready == 'true'
        run: cargo tree --locked --workspace -e features

      - name: Build optimized Linux executable
        if: steps.detect.outputs.linux_app_ready == 'true'
        run: cargo build --locked --release --package suika-authenticator-linux --bin suika-authenticator

      - name: Prepare Linux download
        if: steps.detect.outputs.linux_app_ready == 'true'
        shell: bash
        run: |
          install -D -m 0755 target/release/suika-authenticator dist/suika-authenticator
          install -D -m 0644 Cargo.lock dist/Cargo.lock
          cat > dist/BUILD-INFO.txt <<EOF
          SuikaAuthenticator Linux x86_64 build
          Target: x86_64-unknown-linux-gnu
          Build profile: Cargo release
          Runtime: GTK4 and the system libraries linked by the executable must be installed.
          Commit: ${GITHUB_SHA}
          EOF
          sha256sum dist/suika-authenticator > dist/SHA256SUMS.txt

      - name: Upload Linux executable (expires after 1 day)
        if: steps.detect.outputs.linux_app_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: suika-authenticator-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Enforce no application logging
        run: bash scripts/check-no-application-logs.sh

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          if [[ -f android/settings.gradle.kts && -f android/app/build.gradle.kts && -f android/app/src/main/AndroidManifest.xml && -f android/native/Cargo.toml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android build skipped: the Kotlin application and isolated Rust JNI crate are incomplete."
          fi

      - name: Set up Java
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # actions/setup-java v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.detect.outputs.ready == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # android-actions/setup-android v4.0.4

      - name: Install pinned Android SDK and NDK packages
        if: steps.detect.outputs.ready == 'true'
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Rust for Android
        if: steps.detect.outputs.ready == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # setup-rust-toolchain v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Check Android JNI formatting
        if: steps.detect.outputs.ready == 'true'
        run: cargo fmt --manifest-path android/native/Cargo.toml --all -- --check

      - name: Test Android JNI bridge
        if: steps.detect.outputs.ready == 'true'
        run: cargo test --locked --manifest-path android/native/Cargo.toml

      - name: Run Android JNI Clippy
        if: steps.detect.outputs.ready == 'true'
        run: cargo clippy --locked --manifest-path android/native/Cargo.toml --all-targets -- -D warnings

      - name: Install cargo-ndk
        if: steps.detect.outputs.ready == 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI library for Android ABIs
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo ndk -t arm64-v8a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --locked --release --manifest-path android/native/Cargo.toml

      - name: Set up Gradle 9.6.0
        if: steps.detect.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # gradle/actions v6.4.1
        with:
          gradle-version: "9.6.0"

      - name: Build Android debug APK
        if: steps.detect.outputs.ready == 'true'
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Prepare Android download
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          install -D -m 0644 android/app/build/outputs/apk/debug/app-debug.apk dist/SuikaAuthenticator-android-debug.apk
          install -D -m 0644 android/native/Cargo.lock dist/android-native-Cargo.lock
          printf 'SuikaAuthenticator Android debug APK\nCommit: %s\n' "$GITHUB_SHA" > dist/BUILD-INFO.txt
          sha256sum dist/SuikaAuthenticator-android-debug.apk > dist/SHA256SUMS.txt

      - name: Upload Android APK (expires after 1 day)
        if: steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: suika-authenticator-android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 1
